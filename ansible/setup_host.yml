- name: Setup and configure host with Docker and deployer user
  hosts: webservers
  become: yes

  tasks:
    - name: Ensure deployer user exists
      user:
        name: deployer
        state: present
        shell: /bin/bash
        create_home: yes

    - name: Configure passwordless sudo for deployer
      copy:
        dest: /etc/sudoers.d/deployer
        content: "deployer ALL=(ALL) NOPASSWD: ALL\n"
        mode: '0440'

    - name: Ensure apt keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and dearmor Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker stable repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable\n"
        mode: '0644'

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled at boot
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add deployer user to docker group
      user:
        name: deployer
        groups: docker
        append: yes

    - name: Ensure /opt/app base directory exists
      file:
        path: /opt/app
        state: directory
        owner: deployer
        group: docker
        mode: '0755'

    - name: Copy entire app directory to /opt/app on remote host
      copy:
        src: ../opt/app/
        dest: /opt/app/
        owner: deployer
        group: docker
        mode: '0755'
      notify: Restart docker compose
      
    - name: Run docker compose up on remote host
      community.docker.docker_compose_v2:
        project_src: /opt/app
        state: present
    
  handlers:
    - name: Restart docker compose
      community.docker.docker_compose_v2:
        project_src: /opt/app
        state: restarted
