version: '3.8'

services:
  app:
    image: nginx:alpine
    container_name: hello_app
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - app_net
    restart: always

  # Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net
    depends_on:
      - app
    restart: always

networks:
  app_net:
    driver: bridge
